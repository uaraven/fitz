[package]
name = "fitsmith"
version = "0.4.2"
edition = "2024"
license = "MIT"
description = "A GUI frontend for the fitz FITS toolset."

[[bin]]
name = "fitsmith"
path = "src/main.rs"

# Per-OS installer metadata for `cargo bundle` (macOS `.app`/`.dmg`, Windows
# `.msi`, Linux `.deb`/AppImage). Slint links no external SDK, so the bundle is a
# single self-contained binary.
[package.metadata.bundle]
name = "FitSmith"
identifier = "cc.voronin.fitsmith"
copyright = "Copyright © 2026 Oles Voronin"
short_description = "A GUI frontend for the fitz FITS toolset."
long_description = """
FitSmith is a FITS astronomy images viewer with support for debayering and auto-stretches,
blinking through a working set, and inspecting headers and pixel statistics.
"""
category = "public.app-category.graphics-design"
icon = [
    "assets/32x32.png",
    "assets/128x128.png",
    "assets/128x128@2x.png",
    "assets/256x256.png",
    "assets/256x256@2x.png",
]
# Registers FitSmith as an "Open With" handler (Alternate rank, not default) for
# .fit/.fits/.fit.fz/.fits.fz on macOS. cargo-bundle has no first-class field for
# document-type associations, so this splices raw Info.plist keys in directly.
osx_info_plist_exts = ["assets/document-types.plist.xml"]
linux_mime_types=["image/fits", "application/fits"]

# Linux RPM build (cargo-bundle has no RPM backend). Unlike cargo-bundle's deb
# backend, cargo-generate-rpm doesn't synthesize a .desktop entry from the
# metadata above, so it's listed explicitly as an asset.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fitsmith", dest = "/usr/bin/fitsmith", mode = "755" },
    { source = "target/release/fitz", dest = "/usr/bin/fitz", mode = "755" },
    { source = "assets/fitsmith.desktop", dest = "/usr/share/applications/fitsmith.desktop", mode = "644" },
#    { source = "assets/fitsmith-icon.png", dest = "/usr/share/icons/hicolor/", mode = "644" }
]

[dependencies]
libfitz = { path = "../libfitz" }
slint = "1"
rfd = "0.15"
anyhow = "1"
sysinfo = "0.39.6"
image = { version = "0.25", default-features = false }
rayon = "1"

# macOS only: used to turn off automatic window tabbing so AppKit stops
# injecting "Show Tab Bar"/"Show All Tabs" into our View menu. Already in the
# dependency tree via Slint's winit backend, so this adds no build cost.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"
