[package]
name = "fitz"
version = "0.5.8"
edition = "2024"
license = "MIT"

[[bin]]
name = "fitz"
path = "src/main.rs"

[dependencies]
libfitz = { path = "../libfitz" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
terminal_size = "0.4"
supports-color = "3.0.2"
base64 = "0.23"
libc = "0.2"
sha2 = "0.11"
bayer = "0.1.5"

[dev-dependencies]
tempfile = "3"
